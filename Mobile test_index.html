<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cypher Room</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
    font-family: "Courier New", monospace;
    touch-action: manipulation;
}

/* ===== LOBBY ===== */
#lobby {
    position: absolute;
    inset: 0;
    background: url("Terminal room 2.png") center / cover no-repeat;
    filter: brightness(1) contrast(1.05);
    z-index: 0;
    cursor: pointer;
}

#lobby.hallway {
    background-size: cover;
}

/* Flicker + scanlines */
.flicker { animation: flicker 0.15s infinite alternate; }
@keyframes flicker { from { opacity:0.98; } to { opacity:1; } }

.scanlines::before {
    content:"";
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.15) 1px,
        transparent 2px,
        transparent 4px
    );
    pointer-events:none;
}

/* ===== HOTSPOT ===== */
#computer-hotspot {
    position:absolute;
    width:12vw;
    height:12vw;
    max-width:140px;
    max-height:140px;
    min-width:90px;
    min-height:90px;
    right: 42%;
    top: 46%;
    z-index:2;
}

/* ===== TERMINAL ===== */
#terminal {
    position: fixed;
    inset:0;
    background:black;
    color:#00ff66;
    display:none;
    padding:20px;
    box-sizing:border-box;
    text-shadow:0 0 8px rgba(0,255,100,0.6);
    z-index:3;
}

#terminal pre { font-size:16px; line-height:1.4; }

#terminal-close {
    position:absolute;
    top:12px;
    right:16px;
    background:transparent;
    border:1px solid #00ff66;
    color:#00ff66;
    font-size:20px;
    width:44px;
    height:44px;
    cursor:pointer;
}

#password, #login-btn {
    background:transparent;
    border:1px solid #00ff66;
    color:#00ff66;
    font-family:inherit;
    font-size:18px;
}

/* ===== BOOT ===== */
#boot-screen {
    display:none;
    position: fixed;
    inset:0;
    background:black;
    color:#00ff66;
    padding:20px;
    white-space:pre-wrap;
    z-index:3;
}

/* ===== DESKTOP ===== */
#desktop {
    display:none;
    position:fixed;
    inset:0;
    background:#0b0b0b;
    color:#00ff66;
    padding:20px;
    z-index:3;
}

.desktop-icon {
    display:inline-block;
    width:80px;
    height:100px;
    margin:20px;
    text-align:center;
    cursor:pointer;
}

.desktop-icon .icon { font-size:48px; }
.desktop-icon .label { font-size:16px; margin-top:6px; }

/* Mobile back */
#mobile-back {
    display:none;
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:10;
    background:rgba(0,0,0,0.8);
    border:1px solid #00ff66;
    color:#00ff66;
    font-size:18px;
    padding:10px 14px;
}

@media (max-width: 768px) {
    #mobile-back { display:block; }
}
</style>
</head>

<body>

<div id="lobby" class="flicker scanlines"></div>
<div id="computer-hotspot" title="Use Computer"></div>
<button id="mobile-back">⟵</button>

<div id="terminal" class="flicker scanlines">
    <button id="terminal-close">✕</button>
    <pre id="terminal-text">
CYPHER ROOM ACCESS TERMINAL
--------------------------------
SECURITY LEVEL: LOCKED

AUTHORIZED USERS ONLY

PASSWORD REQUIRED:
    </pre>
    <div>
        <span>&gt;</span>
        <input id="password" type="password" autocomplete="off">
        <button id="login-btn">LOGIN</button>
    </div>
</div>

<div id="boot-screen" class="flicker scanlines"></div>

<div id="desktop" class="flicker scanlines" tabindex="0">
    <div class="desktop-icon" id="checkmate-icon">
        <span class="icon">&#9819;</span>
        <span class="label">Checkmate</span>
    </div>
    <div class="desktop-icon" id="qrd-icon">
        <span class="icon">~</span>
        <span class="label">QRD</span>
    </div>

    <iframe id="qrd-frame" style="display:none;position:absolute;inset:0;z-index:4;"></iframe>
    <iframe id="checkmate-frame" style="display:none;position:absolute;inset:0;z-index:4;"></iframe>
</div>

<audio id="background-music" src="Jitteridle.mp3" loop></audio>

<script>
/* ELEMENTS */
const lobby = document.getElementById("lobby");
const hotspot = document.getElementById("computer-hotspot");
const terminal = document.getElementById("terminal");
const terminalClose = document.getElementById("terminal-close");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("login-btn");
const bootScreen = document.getElementById("boot-screen");
const desktop = document.getElementById("desktop");
const mobileBack = document.getElementById("mobile-back");

const qrdIcon = document.getElementById("qrd-icon");
const checkmateIcon = document.getElementById("checkmate-icon");
const qrdFrame = document.getElementById("qrd-frame");
const checkmateFrame = document.getElementById("checkmate-frame");

const bgMusic = document.getElementById("background-music");

/* STATE */
let bootTimeouts = [];
let inHallway = false;
let inDiary = false;
let musicStarted = false;

/* IMAGES */
const originalLobby = "Terminal room 2.png";
const hallwayImage = "outside_hallway.png";
const diaryImage = "diary.png";

/* ZONE HELPER */
function inZone(x,y,z){
    const w=innerWidth,h=innerHeight;
    return x>=w*z.x1 && x<=w*z.x2 && y>=h*z.y1 && y<=h*z.y2;
}

const ZONES = {
    HALLWAY:{x1:0,x2:0.6,y1:0,y2:0.6},
    BACK:{x1:0,y1:0.75,x2:1,y2:1},
    DIARY:{x1:0.7,x2:0.95,y1:0.35,y2:0.55}
};

/* LOBBY CLICKS */
lobby.addEventListener("click", e => {
    const x=e.clientX, y=e.clientY;

    if(!inDiary && inZone(x,y,ZONES.DIARY)){
        lobby.style.backgroundImage=`url("${diaryImage}")`;
        lobby.classList.add("hallway");
        inDiary=true; inHallway=false;
        hotspot.style.display="none";
        return;
    }

    if(!inHallway && !inDiary && inZone(x,y,ZONES.HALLWAY)){
        lobby.style.backgroundImage=`url("${hallwayImage}")`;
        lobby.classList.add("hallway");
        inHallway=true;
        hotspot.style.display="none";
        return;
    }

    if(inZone(x,y,ZONES.BACK)){
        lobby.style.backgroundImage=`url("${originalLobby}")`;
        lobby.classList.remove("hallway");
        inHallway=false; inDiary=false;
        hotspot.style.display="block";
    }
});

/* TERMINAL OPEN */
hotspot.addEventListener("click", e => {
    e.stopPropagation();
    terminal.style.display="block";
    requestAnimationFrame(()=>passwordInput.focus());
});

/* TERMINAL CLOSE */
terminalClose.onclick=()=>{
    terminal.style.display="none";
    passwordInput.value="";
};

/* PASSWORD */
loginBtn.onclick=()=>{
    if(passwordInput.value.trim().toUpperCase()==="NOEXITFEE"){
        startBootSequence();
    } else {
        passwordInput.value="";
    }
};

function startBootSequence(){
    terminal.style.display="none";
    bootScreen.style.display="block";
    bootScreen.textContent="SYSTEM READY\n";
    setTimeout(()=>{
        bootScreen.style.display="none";
        desktop.style.display="block";
        desktop.focus();
    },800);
}

/* IFRAME */
qrdIcon.onclick=()=>{qrdFrame.src="qrd.html";qrdFrame.style.display="block";};
checkmateIcon.onclick=()=>{checkmateFrame.src="cypher_chess_user_index.html";checkmateFrame.style.display="block";};

/* BACK / ESC */
function handleEscape(){
    if(qrdFrame.style.display==="block"){qrdFrame.style.display="none";qrdFrame.src="";return;}
    if(checkmateFrame.style.display==="block"){checkmateFrame.style.display="none";checkmateFrame.src="";return;}
    if(desktop.style.display==="block"){desktop.style.display="none";return;}
    if(terminal.style.display==="block"){terminal.style.display="none";return;}
}

mobileBack.onclick=handleEscape;
document.addEventListener("keydown",e=>{if(e.key==="Escape")handleEscape();});

/* MUSIC */
function startMusic(){
    if(!musicStarted){
        bgMusic.play().catch(()=>{});
        musicStarted=true;
    }
}
document.addEventListener("click",startMusic,{once:true});
document.addEventListener("keydown",startMusic,{once:true});
</script>

</body>
</html>
