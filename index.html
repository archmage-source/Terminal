<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Cypher Room</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
    font-family: "Courier New", monospace;
    touch-action: manipulation;
}

/* LOBBY */
#lobby {
    position: absolute;
    inset: 0;
    background: url("Terminal room 2.png") center / cover no-repeat;
    filter: brightness(1) contrast(1.05);
    z-index: 0;
    cursor: pointer;
}

/* Flicker + scanlines */
.flicker { animation: flicker 0.15s infinite alternate; }
@keyframes flicker { from { opacity:0.98; } to { opacity:1; } }

.scanlines::before {
    content:"";
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.15) 1px,
        transparent 2px,
        transparent 4px
    );
    pointer-events:none;
}

/* TERMINAL */
#terminal {
    position: fixed;
    inset:0;
    background:black;
    color:#00ff66;
    display:none;
    padding:20px;
    box-sizing:border-box;
    text-shadow:0 0 8px rgba(0,255,100,0.6);
    z-index:3;
    overflow-y: auto;
}

#terminal pre { font-size:16px; line-height:1.4; }

#terminal-close {
    position:absolute;
    top:12px;
    right:16px;
    background:transparent;
    border:1px solid #00ff66;
    color:#00ff66;
    font-size:20px;
    width:44px;
    height:44px;
    cursor:pointer;
}

#password, #login-btn {
    background:transparent;
    border:1px solid #00ff66;
    color:#00ff66;
    font-family:inherit;
    font-size:18px;
}

/* BOOT SCREEN */
#boot-screen {
    display:none;
    position: fixed;
    inset:0;
    background:black;
    color:#00ff66;
    padding:20px;
    white-space:pre-wrap;
    overflow-y:auto;
    z-index:3;
}

/* DESKTOP */
#desktop {
    display:none;
    position:fixed;
    inset:0;
    background:#0b0b0b;
    color:#00ff66;
    padding:20px;
    z-index:3;
    overflow:hidden;
}

.desktop-icon {
    display:inline-block;
    width:80px;
    height:100px;
    margin:20px;
    text-align:center;
    cursor:pointer;
}

.desktop-icon .icon { font-size:48px; }
.desktop-icon .label { font-size:16px; margin-top:6px; }

/* IFRAME 1920x1080 with pinch zoom */
iframe {
    display:none;
    width:1920px;
    height:1080px;
    max-width:100%;
    max-height:100%;
    border:none;
    z-index:4;
    position:fixed;
    top:50%;
    left:50%;
    transform: translate(-50%, -50%);
    background:black;
    touch-action: pan-x pan-y pinch-zoom;
}

/* BACK BUTTON */
#mobile-back {
    display:none; /* HIDDEN BY DEFAULT */
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:10;
    background:rgba(0,0,0,0.8);
    border:1px solid #00ff66;
    color:#00ff66;
    font-size:18px;
    padding:10px 14px;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="lobby" class="flicker scanlines"></div>

<div id="terminal" class="flicker scanlines">
    <button id="terminal-close">✕</button>
    <pre id="terminal-text">
CYPHER ROOM ACCESS TERMINAL
--------------------------------
SECURITY LEVEL: LOCKED

AUTHORIZED USERS ONLY

PASSWORD REQUIRED:
    </pre>
    <div>
        <span>&gt;</span>
        <input id="password" type="password" autocomplete="off">
        <button id="login-btn">LOGIN</button>
    </div>
</div>

<div id="boot-screen" class="flicker scanlines"></div>

<div id="desktop" class="flicker scanlines" tabindex="0">
    <div class="desktop-icon" id="checkmate-icon">
        <span class="icon">&#9819;</span>
        <span class="label">Checkmate</span>
    </div>
    <div class="desktop-icon" id="qrd-icon">
        <span class="icon">~</span>
        <span class="label">QRD</span>
    </div>

    <iframe id="qrd-frame"></iframe>
    <iframe id="checkmate-frame"></iframe>
</div>

<button id="mobile-back">⟵ BACK</button>

<audio id="background-music" src="Jitteridle.mp3" loop></audio>

<script>
const lobby = document.getElementById("lobby");
const terminal = document.getElementById("terminal");
const terminalClose = document.getElementById("terminal-close");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("login-btn");
const bootScreen = document.getElementById("boot-screen");
const desktop = document.getElementById("desktop");
const mobileBack = document.getElementById("mobile-back");

const qrdIcon = document.getElementById("qrd-icon");
const checkmateIcon = document.getElementById("checkmate-icon");
const qrdFrame = document.getElementById("qrd-frame");
const checkmateFrame = document.getElementById("checkmate-frame");

const bgMusic = document.getElementById("background-music");

let inHallway=false, inDiary=false, inTerminal=false, inIframe=false;
let musicStarted=false;

const originalLobby = "Terminal room 2.png";
const hallwayImage = "outside_hallway.png";
const diaryImage = "diary.png";

const bootSteps=[
    "SYSTEM BOOT INITIATED...",
    "LOADING MODULES...",
    "CALIBRATING RESONATOR...",
    "INITIALIZING NETWORK INTERFACE...",
    "SECURITY CHECK: OK",
    "LOADING AI PROTOCOLS...",
    "SYNCHRONIZING CLOCKS...",
    "SYSTEM READY"
];

// Lobby click triggers
lobby.addEventListener("click", e=>{
    if(inHallway||inDiary||inTerminal||inIframe) return;

    const x=e.clientX;

    if(x < window.innerWidth*0.4){ // Left = hallway
        lobby.style.backgroundImage = `url("${hallwayImage}")`;
        inHallway=true;
        mobileBack.style.display="block";
        return;
    }
    if(x > window.innerWidth*0.6){ // Right = diary
        lobby.style.backgroundImage = `url("${diaryImage}")`;
        inDiary=true;
        mobileBack.style.display="block";
        return;
    }
    // Middle = terminal
    if(x>=window.innerWidth*0.4 && x<=window.innerWidth*0.6){
        terminal.style.display="block";
        inTerminal=true;
        requestAnimationFrame(()=>passwordInput.focus());
    }
});

// Terminal close
terminalClose.onclick = ()=>{
    terminal.style.display="none";
    passwordInput.value="";
    inTerminal=false;
};

// Password
loginBtn.onclick = ()=>{
    if(passwordInput.value.trim().toUpperCase()==="NOEXITFEE"){
        startBootSequence();
    } else {
        passwordInput.value="";
    }
};

// Boot sequence
function startBootSequence(){
    terminal.style.display="none";
    inTerminal=false;
    bootScreen.style.display="block";
    bootScreen.textContent="";
    let i=0;
    function nextStep(){
        if(i<bootSteps.length){
            bootScreen.textContent+=bootSteps[i]+"\n";
            bootScreen.scrollTop=bootScreen.scrollHeight;
            i++;
            setTimeout(nextStep,700);
        } else {
            setTimeout(()=>{
                bootScreen.style.display="none";
                desktop.style.display="block";
                desktop.focus();
            },500);
        }
    }
    nextStep();
}

// Iframes
qrdIcon.onclick = ()=>{
    qrdFrame.src="qrd.html";
    qrdFrame.style.display="block";
    inIframe=true;
    mobileBack.style.display="block";
};
checkmateIcon.onclick = ()=>{
    checkmateFrame.src="cypher_chess_user_index.html";
    checkmateFrame.style.display="block";
    inIframe=true;
    mobileBack.style.display="block";
};

// Back button
mobileBack.onclick = ()=>{
    lobby.style.backgroundImage=`url("${originalLobby}")`;
    inHallway=false;
    inDiary=false;
    inTerminal=false;
    inIframe=false;

    terminal.style.display="none";
    desktop.style.display="none";

    qrdFrame.style.display="none"; qrdFrame.src="";
    checkmateFrame.style.display="none"; checkmateFrame.src="";

    mobileBack.style.display="none";
};

// ESC key
document.addEventListener("keydown", e=>{
    if(e.key==="Escape") mobileBack.click();
});

// Music
function startMusic(){
    if(!musicStarted){
        bgMusic.play().catch(()=>{});
        musicStarted=true;
    }
}
document.addEventListener("click", startMusic,{once:true});
document.addEventListener("keydown", startMusic,{once:true});
</script>

</body>
</html>
