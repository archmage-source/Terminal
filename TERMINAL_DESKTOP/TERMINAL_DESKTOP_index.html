<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cypher Room</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
    font-family: "Courier New", monospace;
}

/* ===== LOBBY ===== */
#lobby {
    position: absolute;
    inset: 0;
    background: url("Terminal room 2_desktopVersion.png") center center / cover no-repeat;
    filter: brightness(1) contrast(1.05);
    z-index: 0;
    cursor: pointer;
}

#lobby.hallway {
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
}

/* Flicker + scanlines */
.flicker { animation: flicker 0.15s infinite alternate; }
@keyframes flicker { from { opacity:0.98; } to { opacity:1; } }
.scanlines::before {
    content:"";
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.15) 1px,
        transparent 2px,
        transparent 4px
    );
    pointer-events:none;
}

/* HOTSPOT */
#computer-hotspot {
    position:absolute;
    width:100px;
    height:100px;
    right: calc(41% - 30px);
    top: calc(40% - 20px);
    cursor:pointer;
    z-index:2;
}

/* TERMINAL */
#terminal {
    position: fixed;
    inset:0;
    background:black;
    color:#00ff66;
    display:none;
    padding:40px;
    box-sizing:border-box;
    text-shadow:0 0 8px rgba(0,255,100,0.6);
    z-index:3;
}
#terminal pre { font-size:18px; line-height:1.4; }
#terminal-close {
    position:absolute;
    top:12px;
    right:16px;
    background:transparent;
    border:1px solid #00ff66;
    color:#00ff66;
    font-family:"Courier New", monospace;
    font-size:18px;
    width:32px;
    height:32px;
    cursor:pointer;
    text-align:center;
    line-height:28px;
}
#terminal-close:hover { background:#00ff66; color:black; }
#password {
    background:transparent;
    border:1px solid #00ff66;
    outline:none;
    color:#00ff66;
    font-family:inherit;
    font-size:18px;
    caret-color:#00ff66;
    padding:2px 6px;
}
#login-btn {
    background:transparent;
    border:1px solid #00ff66;
    color:#00ff66;
    font-family:inherit;
    font-size:18px;
    cursor:pointer;
    padding:2px 6px;
    margin-left:10px;
}

/* BOOT */
#boot-screen {
    display:none;
    position: fixed;
    inset:0;
    background:black;
    color:#00ff66;
    font-family:"Courier New", monospace;
    padding:20px;
    overflow:hidden;
    white-space:pre-wrap;
    z-index:3;
}

/* DESKTOP */
#desktop {
    display:none;
    position:fixed;
    inset:0;
    background:#0b0b0b;
    color:#00ff66;
    font-family:"Courier New", monospace;
    padding:20px;
    outline:none;
    z-index:3;
}

.desktop-icon {
    display:inline-block;
    width:80px;
    height:100px;
    margin:20px;
    text-align:center;
    cursor:pointer;
}
.desktop-icon .icon { font-size:48px; display:block; }
.desktop-icon .label { font-size:16px; margin-top:6px; color:#00ff66; display:block; }
.ac-wave { display:inline-block; font-size:48px; color:#00ff66; animation: wave 1s infinite linear; }
@keyframes wave { 0%{transform:translateY(0);}25%{transform:translateY(-6px);}50%{transform:translateY(0);}75%{transform:translateY(6px);}100%{transform:translateY(0);} }
</style>
</head>
<body>

<div id="lobby" class="flicker scanlines"></div>
<div id="computer-hotspot" title="Use Computer"></div>

<div id="terminal" class="flicker scanlines">
    <button id="terminal-close">✕</button>
    <pre id="terminal-text">
CYPHER ROOM ACCESS TERMINAL
--------------------------------
SECURITY LEVEL: LOCKED

AUTHORIZED USERS ONLY

PASSWORD REQUIRED:
    </pre>
    <div id="password-row">
        <span class="prompt">&gt;</span>
        <input id="password" type="password" autocomplete="off">
        <button id="login-btn">LOGIN</button>
    </div>
</div>

<div id="boot-screen" class="flicker scanlines"></div>

<div id="desktop" class="flicker scanlines" tabindex="0">
    <!-- Desktop icons -->
    <div class="desktop-icon" id="checkmate-icon">
        <span class="icon">&#9819;</span>
        <span class="label">Checkmate</span>
    </div>
    <div class="desktop-icon" id="qrd-icon">
        <span class="icon ac-wave">~</span>
        <span class="label">QRD</span>
    </div>

    <!-- QRD iframe overlay -->
    <iframe id="qrd-frame" src="" style="
        display:none;
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:100%;
        border:none;
        z-index:4;
    "></iframe>

    <!-- Checkmate iframe overlay -->
    <iframe id="checkmate-frame" src="" style="
        display:none;
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:100%;
        border:none;
        z-index:4;
    "></iframe>
</div>

<!-- Background music (no autoplay) -->
<audio id="background-music" src="Jitteridle.mp3" loop></audio>

<script>
const lobby = document.getElementById("lobby");
const hotspot = document.getElementById("computer-hotspot");
const terminal = document.getElementById("terminal");
const terminalClose = document.getElementById("terminal-close");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("login-btn");
const bootScreen = document.getElementById("boot-screen");
const desktop = document.getElementById("desktop");
const terminalText = document.getElementById("terminal-text");
const qrdIcon = document.getElementById('qrd-icon');
const qrdFrame = document.getElementById('qrd-frame');
const checkmateIcon = document.getElementById('checkmate-icon');
const checkmateFrame = document.getElementById('checkmate-frame');
const desktopIcons = desktop.querySelectorAll('.desktop-icon');
const bgMusic = document.getElementById("background-music");

let bootTimeouts = [];
let inHallway = false;
let inDiary = false;
let musicStarted = false;

const originalLobby = "Terminal room 2_desktopVersion.png";
const hallwayImage = "outside_hallway_desktopVersion.png";
const diaryImage = "diary_desktopVersion.png";

/* --- Lobby clicks --- */
lobby.addEventListener("click", (e) => {
    const clickY = e.clientY;
    const clickX = e.clientX;
    const windowHeight = window.innerHeight;
    const windowWidth = window.innerWidth;
    const hotspotRect = hotspot.getBoundingClientRect();
    const diaryArea = { xStart: hotspotRect.right + 10, xEnd: hotspotRect.right + 50, yStart: hotspotRect.top, yEnd: hotspotRect.top + 50 };

    if (!inDiary && clickX >= diaryArea.xStart && clickX <= diaryArea.xEnd && clickY >= diaryArea.yStart && clickY <= diaryArea.yEnd) {
        lobby.style.backgroundImage = `url("${diaryImage}")`;
        lobby.classList.add("hallway");
        inDiary = true; inHallway = false;
        hotspot.style.display = "none";
    } 
    else if (!inHallway && !inDiary && clickY < windowHeight * 0.7 && clickX < windowWidth * 0.5) {
        lobby.style.backgroundImage = `url("${hallwayImage}")`;
        lobby.classList.add("hallway");
        inHallway = true;
        hotspot.style.display = "none";
    }
    else if (clickY > windowHeight * 0.7) {
        lobby.style.backgroundImage = `url("${originalLobby}")`;
        lobby.classList.remove("hallway");
        inHallway = false; inDiary = false;
        hotspot.style.display = "block";
    }
});

/* --- Terminal open/close --- */
hotspot.addEventListener("click", (e) => {
    e.preventDefault();
    if (hotspot.style.display === "block") {
        terminal.style.display = "block";
        terminalText.scrollTop = terminalText.scrollHeight;
        requestAnimationFrame(() => passwordInput.focus());
    }
});
function closeTerminal() { terminal.style.display = "none"; passwordInput.value = ""; }
terminalClose.addEventListener("click", closeTerminal);

/* --- Boot sequence --- */
function startBootSequence() {
    terminal.style.display = "none";
    bootScreen.style.display = "block";
    bootScreen.textContent = "";
    bootTimeouts = [];
    const bootLines = [
        "SYSTEM BOOT INITIATED...",
        "LOADING MODULES...",
        "CALIBRATING RESONATOR...",
        "INITIALIZING NETWORK INTERFACE...",
        "SECURITY CHECK: OK",
        "LOADING AI PROTOCOLS...",
        "SYNCHRONIZING CLOCKS...",
        "SYSTEM READY"
    ];
    let delay = 0;
    bootLines.forEach((line,i) => {
        const timeout = setTimeout(() => {
            bootScreen.textContent += line + "\n";
            bootScreen.scrollTop = bootScreen.scrollHeight;
            if(i===bootLines.length-1) {
                const endTimeout = setTimeout(() => { bootScreen.style.display="none"; desktop.style.display="block"; desktop.focus(); }, 500);
                bootTimeouts.push(endTimeout);
            }
        }, delay);
        bootTimeouts.push(timeout);
        delay += 500 + Math.random()*300;
    });
}

/* --- Password check --- */
function checkPassword() {
    const value = passwordInput.value.trim().toUpperCase();
    if(value==="NOEXITFEE") startBootSequence();
    else {
        if(!terminalText.textContent.includes("ACCESS DENIED")) terminalText.textContent += "\nACCESS DENIED\n";
        passwordInput.value = "";
        requestAnimationFrame(()=>passwordInput.focus());
    }
}
loginBtn.addEventListener("click",checkPassword);
passwordInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter") checkPassword(); });

/* --- Iframe open/close --- */
function openIframe(frame, src) {
    frame.src = src;
    frame.style.display = "block";
    desktopIcons.forEach(icon => icon.style.pointerEvents = 'none');
}

function closeIframe(frame){
    frame.style.display = "none";
    frame.src = "";
    desktopIcons.forEach(icon => icon.style.pointerEvents = 'auto');
    desktop.focus();
}

qrdIcon.addEventListener('click', () => openIframe(qrdFrame,'qrd.html'));
checkmateIcon.addEventListener('click', () => openIframe(checkmateFrame,'cypher_chess_user_index.html'));

/* --- ESC key handler --- */
function handleEscape() {
    if(terminal.style.display==="block") closeTerminal();
    else if(bootScreen.style.display==="block") {
        bootScreen.style.display="none";
        terminal.style.display="block";
        requestAnimationFrame(()=>passwordInput.focus());
        bootTimeouts.forEach(id=>clearTimeout(id));
        bootTimeouts=[];
    }
    else if(qrdFrame.style.display==="block") closeIframe(qrdFrame);
    else if(checkmateFrame.style.display==="block") closeIframe(checkmateFrame);
    else if(desktop.style.display==="block") {
        desktop.style.display = "none";
        lobby.style.display = "block";
        inHallway = false;
        inDiary = false;
        hotspot.style.display = "block";
    }
}

/* Global escape listener */
document.addEventListener("keydown", (e) => { if(e.key==="Escape") handleEscape(); });

/* Listen for iframe messages to close */
window.addEventListener("message", (e) => {
    if(e.data === "closeIframe") handleEscape();
});

/* --- Background music autoplay workaround --- */
function startMusic() {
    if (!musicStarted) {
        bgMusic.play().catch(e => console.log("Autoplay prevented:", e));
        musicStarted = true;
    }
}

// Start music on first user interaction
document.addEventListener("click", startMusic, { once: true });
document.addEventListener("keydown", startMusic, { once: true });
</script>
</body>
</html>
